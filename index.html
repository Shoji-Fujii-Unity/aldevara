<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>ALDEVARA ― 中世都市経営シミュレーション</title>
<style>
/* ALDEVARA - Medieval City Simulator (landscape 16:9, mobile friendly) */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d12; }
body {
  font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans CJK SC", "Yu Gothic UI", Meiryo, sans-serif;
  color: #e8dcc0; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
#stage { position: fixed; inset: 0; background: radial-gradient(120% 120% at 50% 0%, #1a2030 0%, #0b0d12 70%); }
#app {
  position: absolute; left: 50%; top: 50%; width: 960px; height: 540px;
  transform-origin: center center; overflow: hidden;
  background: #141824; box-shadow: 0 0 60px #000;
}
section.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
section.screen.on { display: flex; }

/* ---------- rotate hint (portrait handled by auto-rotate in fit(); hidden) ---------- */
#rotate { display: none !important; }

/* ---------- common ---------- */
.btn {
  border: 1px solid #6b5426; border-radius: 8px; cursor: pointer; color: #f4e9c8;
  background: linear-gradient(#4a3b1e, #332814); padding: 8px 16px; font-size: 14px; font-weight: 600;
  text-shadow: 0 1px 2px #000; box-shadow: 0 2px 0 #1c1509, inset 0 1px 0 #7a6230;
}
.btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #1c1509; }
.btn.prime { background: linear-gradient(#8a6a26, #5e4718); border-color: #a5813a; font-size: 16px; }
.btn.mini { padding: 4px 9px; font-size: 12px; }
.btn.danger { background: linear-gradient(#5e2622, #3c1815); border-color: #7c3a33; }
.btn.on2 { outline: 2px solid #d9a441; }
.btn[disabled] { opacity: .45; pointer-events: none; }
h1,h2,h3 { font-weight: 800; }
.panel { background: rgba(10,12,18,.78); border: 1px solid #3a4254; }
.ptitle { font-size: 12px; color: #d9a441; letter-spacing: 1px; margin-bottom: 4px; font-weight: 800; }

/* ---------- title ---------- */
#screen-title { align-items: center; justify-content: center; gap: 10px;
  background: radial-gradient(90% 120% at 50% 115%, #3d3118 0%, transparent 60%),
              radial-gradient(120% 120% at 50% -20%, #232c44 0%, #0b0d12 75%); }
#screen-title .crest { font-size: 54px; filter: drop-shadow(0 4px 8px #000); }
#title-logo { font-size: 64px; letter-spacing: 12px; font-weight: 900; color: #e7c66b;
  text-shadow: 0 0 24px #a97b2a88, 0 4px 0 #5c451a, 0 6px 12px #000; }
#title-sub { font-size: 15px; letter-spacing: 4px; color: #cbb87f; margin-bottom: 22px; }
#title-btns { display: flex; flex-direction: column; gap: 10px; width: 300px; }
#title-btns .btn { width: 100%; }
#title-bottom { position: absolute; bottom: 10px; left: 0; right: 0; display: flex;
  justify-content: center; gap: 8px; font-size: 11px; color: #8a7a55; }

/* ---------- stages ---------- */
#screen-stages { padding: 14px; gap: 10px; }
#stages-head { display: flex; align-items: center; gap: 12px; }
#stages-head h2 { color: #e7c66b; letter-spacing: 2px; }
#stages-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; padding: 2px; }
.scard { border: 1px solid #4a3d5f; border-radius: 10px; padding: 8px 9px; cursor: pointer;
  background: linear-gradient(#242b3d, #191e2b); display: flex; flex-direction: column; gap: 3px; min-height: 108px; }
.scard:active { transform: scale(.98); }
.scard.locked { filter: grayscale(1) brightness(.55); }
.scard .no { font-size: 10px; color: #8f9cb5; letter-spacing: 1px; }
.scard .nm { font-size: 14px; font-weight: 800; color: #f0dfae; }
.scard .ds { font-size: 10.5px; color: #a7b3c9; line-height: 1.45; flex: 1; }
.scard .st { color: #f2c14b; font-size: 12px; letter-spacing: 2px; }
.scard .bd { font-size: 10px; color: #7fd18a; }

/* ---------- game ---------- */
#screen-game { }
#hud { height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
  background: linear-gradient(#1d2231, #141824); border-bottom: 1px solid #333a4a; }
#hud .sp { flex: 1; }
#hud-stage { font-size: 13px; font-weight: 800; color: #f0dfae; max-width: 150px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud-day { font-size: 12px; color: #9fb0cc; min-width: 74px; text-align: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: #101521; border: 1px solid #2e3749;
  border-radius: 20px; padding: 3px 9px; font-size: 12px; font-weight: 700; color: #dfe6f2; white-space: nowrap; }
.chip .ic { font-size: 12px; }
.chip b { color: #fff; font-weight: 800; }
.chip .cap { color: #6c7a92; font-weight: 400; font-size: 10px; }
.chip.warn b { color: #ff9d7a; }
#hud-right { display: flex; align-items: center; gap: 4px; }
#hud-right .btn { padding: 4px 8px; font-size: 12px; }

#game-mid { flex: 1; display: flex; min-height: 0; }
#buildpanel { width: 172px; padding: 8px; background: #111621; border-right: 1px solid #2c3447;
  display: flex; flex-direction: column; overflow: hidden; }
#build-hint { font-size: 9.5px; color: #7d8aa3; margin-bottom: 6px; line-height: 1.4; }
#build-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 3px; }
.bitem { border: 1px solid #33405a; border-radius: 8px; background: #182031; padding: 5px 7px; cursor: pointer; }
.bitem.sel { border-color: #d9a441; background: #2b241c; outline: 1px solid #d9a441; }
.bitem.noaf { opacity: .45; }
.bitem .r1 { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #eee3c4; }
.bitem .r1 .em { font-size: 15px; }
.bitem .r2 { font-size: 10.5px; color: #9fb0cc; margin-top: 2px; padding-left: 21px; }

#cvwrap { flex: 1; position: relative; min-width: 0; background: #0e1320; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#banner { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: none;
  background: rgba(90,20,15,.88); border: 1px solid #c25b40; color: #ffd9c4; font-weight: 800;
  font-size: 13px; padding: 6px 16px; border-radius: 20px; white-space: nowrap; z-index: 5; }
#log { position: absolute; left: 8px; bottom: 8px; z-index: 4; display: flex; flex-direction: column-reverse;
  gap: 3px; pointer-events: none; max-width: 78%; }
#log .lg { background: rgba(8,10,16,.72); border-left: 3px solid #d9a441; border-radius: 4px;
  padding: 3px 9px; font-size: 11px; color: #eef; animation: lgf .25s ease-out; }
#log .lg.bad { border-left-color: #c25b40; color: #ffc9b8; }
#log .lg.good { border-left-color: #6fbf73; color: #c9f0cd; }
@keyframes lgf { from { opacity: 0; transform: translateY(6px); } }
#savechip { position: absolute; right: 8px; bottom: 8px; z-index: 4; font-size: 10px; color: #7fd18a;
  opacity: 0; transition: opacity .4s; background: rgba(8,10,16,.6); padding: 2px 8px; border-radius: 10px; }

#infopanel { width: 208px; padding: 8px; background: #111621; border-left: 1px solid #2c3447;
  overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.ipanel { border: 1px solid #2c3447; border-radius: 8px; padding: 7px 8px; background: #182031; }
.obj { font-size: 11.5px; padding: 2.5px 0; color: #cfd8e8; display: flex; gap: 5px; align-items: baseline; }
.obj .ck { font-size: 11px; }
.obj.done { color: #8fd69a; text-decoration: none; }
.obj .pg { color: #7d8aa3; font-size: 10.5px; }
#raidbox .big { font-size: 12.5px; font-weight: 800; color: #f2c14b; }
#raidbox .sub { font-size: 11px; color: #aeb9cd; margin-top: 3px; line-height: 1.5; }
#raidbox .good { color: #7fd18a; } #raidbox .bad { color: #ff8f70; font-weight: 800; }
#selbox .nm { font-size: 14px; font-weight: 800; color: #f0dfae; }
#selbox .ds { font-size: 10.5px; color: #9fb0cc; margin: 3px 0 6px; line-height: 1.5; }
#selbox .ln { font-size: 11px; color: #cfd8e8; padding: 1.5px 0; }
#selbox .btn { width: 100%; margin-top: 5px; }

/* ---------- overlays ---------- */
.ovl { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
  background: rgba(4,6,10,.78); }
.ovl.on { display: flex; }
.card { width: 480px; max-height: 500px; overflow-y: auto; background: linear-gradient(#232a3d, #161b28);
  border: 1px solid #6b5426; border-radius: 14px; padding: 22px 26px; text-align: center;
  box-shadow: 0 12px 50px #000; }
.card h2 { color: #e7c66b; margin-bottom: 10px; letter-spacing: 1px; }
.card p { font-size: 13px; color: #c7d1e2; line-height: 1.7; }
.card .btn { margin: 6px 4px 0; }
#help-body { white-space: pre-line; text-align: left; font-size: 12.5px; }
#stars-big { font-size: 40px; letter-spacing: 8px; color: #f2c14b; text-shadow: 0 0 18px #a97b2a; margin: 4px 0; }
#win-info { margin-bottom: 6px; white-space: pre-line; }

/* scrollbars */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #3a4257; border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- royal finish ---------- */
:root {
  color-scheme: dark;
  --gold: #d8b15a;
  --gold-light: #f3dfa0;
  --ink: #10131d;
  --panel: #171d2b;
}
body {
  background:
    radial-gradient(ellipse at 50% 10%, #27304a 0%, #11141e 54%, #090b10 100%);
}
#stage {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(196,157,76,.12), transparent 42%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 1px, transparent 1px 5px),
    #0b0d12;
}
#app {
  border: 1px solid rgba(216,177,90,.5);
  box-shadow: 0 24px 80px rgba(0,0,0,.72), inset 0 0 0 1px rgba(255,255,255,.035);
}
#app::before {
  content: "";
  position: absolute;
  inset: 7px;
  z-index: 12;
  border: 1px solid rgba(216,177,90,.22);
  pointer-events: none;
}
.btn {
  border-color: #79602f;
  background: linear-gradient(180deg, #393344 0%, #242433 100%);
  box-shadow: 0 3px 0 #11111a, inset 0 1px 0 rgba(255,255,255,.13);
  transition: filter .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.btn.prime {
  color: #fff3c8;
  border-color: #d4ae5e;
  background: linear-gradient(180deg, #b38b3c 0%, #806027 48%, #5b431e 100%);
  box-shadow: 0 3px 0 #30220f, inset 0 1px 0 rgba(255,239,183,.55), 0 0 18px rgba(205,163,75,.16);
}
.btn.danger {
  border-color: #8d4a3e;
  background: linear-gradient(180deg, #71352f, #43201f);
}
.btn:hover:not([disabled]) {
  filter: brightness(1.18);
  border-color: var(--gold-light);
}
.btn:focus-visible {
  outline: 2px solid var(--gold-light);
  outline-offset: 2px;
}
#screen-title {
  background:
    radial-gradient(ellipse at 50% 40%, rgba(118,88,41,.24), transparent 38%),
    radial-gradient(90% 120% at 50% 115%, #41331b 0%, transparent 58%),
    radial-gradient(120% 120% at 50% -20%, #29334e 0%, #0c0f17 75%);
}
#screen-title .crest {
  filter: drop-shadow(0 5px 8px #000) drop-shadow(0 0 22px rgba(218,177,89,.35));
}
#title-logo {
  background: linear-gradient(180deg, #fff1b7 8%, #e4c66f 48%, #b78332 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 3px 0 #4c3817) drop-shadow(0 8px 14px #000);
}
#title-sub {
  color: #d8c38b;
  text-shadow: 0 2px 8px #000;
}
#title-btns .btn {
  min-height: 42px;
  letter-spacing: .08em;
}
#title-bottom {
  left: 18px;
  right: 18px;
  bottom: 12px;
  padding: 7px 10px;
  border: 1px solid rgba(216,177,90,.2);
  border-radius: 10px;
  background: rgba(8,10,16,.48);
  color: #aa9b76;
}
#screen-stages {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(88,105,143,.2), transparent 55%),
    linear-gradient(145deg, #171c2a, #10131d);
}
#stages-head {
  padding: 5px 4px 10px;
  border-bottom: 1px solid rgba(216,177,90,.3);
}
#stages-head h2 {
  color: var(--gold-light);
  text-shadow: 0 2px 10px rgba(216,177,90,.2);
}
.scard {
  position: relative;
  overflow: hidden;
  border-color: rgba(176,149,91,.4);
  background:
    linear-gradient(145deg, rgba(72,79,103,.5), transparent 55%),
    linear-gradient(180deg, #242a3b, #171b28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 5px 14px rgba(0,0,0,.18);
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.scard:not(.locked):hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 8px 20px rgba(0,0,0,.3), 0 0 16px rgba(216,177,90,.1);
}
.scard .nm { color: #f2dfad; }
.scard .st { text-shadow: 0 0 10px rgba(242,193,75,.35); }
#hud {
  background: linear-gradient(180deg, #22283a, #131722);
  border-bottom-color: rgba(216,177,90,.35);
  box-shadow: 0 4px 18px rgba(0,0,0,.2);
}
#hud-stage { color: var(--gold-light); }
.chip {
  border-color: rgba(160,170,196,.22);
  background: linear-gradient(180deg, #1a2030, #10141e);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 6px rgba(0,0,0,.16);
}
.chip b { text-shadow: 0 0 8px rgba(255,255,255,.1); }
#buildpanel, #infopanel {
  background:
    linear-gradient(145deg, rgba(39,47,67,.28), transparent 42%),
    #111621;
}
#buildpanel { border-right-color: rgba(216,177,90,.22); }
#infopanel { border-left-color: rgba(216,177,90,.22); }
.ptitle {
  color: var(--gold-light);
  padding-bottom: 5px;
  border-bottom: 1px solid rgba(216,177,90,.22);
  text-shadow: 0 0 12px rgba(216,177,90,.18);
}
.bitem {
  border-color: #3c465e;
  background: linear-gradient(145deg, #20283a, #171d2b);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
  transition: border-color .15s ease, background .15s ease, transform .15s ease;
}
.bitem:hover {
  border-color: #927840;
  background: linear-gradient(145deg, #2b3040, #1d2230);
  transform: translateX(2px);
}
.bitem.sel {
  border-color: var(--gold);
  background: linear-gradient(145deg, #3c3425, #26221d);
  box-shadow: inset 0 0 0 1px rgba(216,177,90,.25), 0 0 12px rgba(216,177,90,.1);
}
.ipanel {
  border-color: rgba(150,163,194,.22);
  background:
    linear-gradient(145deg, rgba(53,63,87,.28), transparent 52%),
    linear-gradient(180deg, #1b2232, #151b28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 4px 12px rgba(0,0,0,.12);
}
#raidbox .big { text-shadow: 0 0 12px rgba(242,193,75,.17); }
#selbox .nm { color: var(--gold-light); }
#cvwrap {
  box-shadow: inset 0 0 30px rgba(8,11,18,.24);
}
.ovl {
  background: rgba(4,6,10,.78);
  backdrop-filter: blur(5px);
}
.card {
  position: relative;
  border-color: rgba(216,177,90,.72);
  border-radius: 12px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(116,93,51,.18), transparent 52%),
    linear-gradient(145deg, #282d3e, #151a27 72%);
  box-shadow: 0 22px 70px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.08);
}
.card::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(216,177,90,.16);
  border-radius: 8px;
  pointer-events: none;
}
.card h2 {
  color: var(--gold-light);
  text-shadow: 0 2px 12px rgba(216,177,90,.2);
}
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #9e8044, #55472d);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}

</style>
</head>
<body>

<div id="stage">
<div id="app">

  <!-- ===== TITLE ===== -->
  <section id="screen-title" class="screen on">
    <div class="crest">🏰</div>
    <div id="title-logo">ALDEVARA</div>
    <div id="title-sub" data-i18n="app_sub"></div>
    <div id="title-btns">
      <button class="btn prime" id="btn-play" data-i18n="btn_play"></button>
      <button class="btn" id="btn-continue" data-i18n="btn_continue" style="display:none"></button>
      <button class="btn" id="btn-stages" data-i18n="btn_stages"></button>
      <button class="btn" id="btn-help" data-i18n="btn_help"></button>
    </div>
    <div id="title-bottom">
      <button class="btn mini" id="btn-lang"></button>
      <button class="btn mini" id="btn-sound"></button>
      <button class="btn mini" id="btn-reset" data-i18n="reset_data"></button>
      <span>© ALDEVARA · autosave on device</span>
    </div>
  </section>

  <!-- ===== STAGES ===== -->
  <section id="screen-stages" class="screen">
    <div id="stages-head">
      <button class="btn mini" id="btn-stages-back" data-i18n="btn_back"></button>
      <h2 data-i18n="ttl_stages"></h2>
      <span style="flex:1"></span>
      <span class="chip"><span class="ic">⭐</span><b id="star-total">0</b>/42</span>
    </div>
    <div id="stages-grid"></div>
  </section>

  <!-- ===== GAME ===== -->
  <section id="screen-game" class="screen">
    <div id="hud">
      <button class="btn mini" id="btn-menu">☰</button>
      <div id="hud-stage">–</div>
      <div class="sp"></div>
      <span class="chip" id="chip-gold"><span class="ic">💰</span><b>0</b></span>
      <span class="chip" id="chip-food"><span class="ic">🍞</span><b>0</b><span class="cap">/0</span></span>
      <span class="chip" id="chip-wood"><span class="ic">🪵</span><b>0</b><span class="cap">/0</span></span>
      <span class="chip" id="chip-stone"><span class="ic">🪨</span><b>0</b><span class="cap">/0</span></span>
      <span class="chip" id="chip-pop"><span class="ic">👥</span><b>0</b><span class="cap">/0</span></span>
      <span class="chip" id="chip-happy"><span class="ic">😊</span><b>0</b></span>
      <span class="chip" id="chip-def"><span class="ic">🛡️</span><b>0</b></span>
      <div class="sp"></div>
      <div id="hud-day">Day 1</div>
      <div id="hud-right">
        <button class="btn mini" id="btn-pause" data-i18n="spd_pause"></button>
        <button class="btn mini spd" data-s="1">1x</button>
        <button class="btn mini spd" data-s="2">2x</button>
        <button class="btn mini spd" data-s="3">3x</button>
        <button class="btn mini" id="btn-sound2"></button>
        <button class="btn mini" id="btn-lang2"></button>
      </div>
    </div>
    <div id="game-mid">
      <div id="buildpanel">
        <div class="ptitle" data-i18n="panel_build"></div>
        <div id="build-hint" data-i18n="build_hint"></div>
        <div id="build-list"></div>
      </div>
      <div id="cvwrap">
        <canvas id="cv"></canvas>
        <div id="banner"></div>
        <div id="log"></div>
        <div id="savechip" data-i18n="saved_note"></div>
      </div>
      <div id="infopanel">
        <div class="ipanel" id="objbox"><div class="ptitle" data-i18n="panel_obj"></div><div id="obj-list"></div></div>
        <div class="ipanel" id="raidbox"><div class="ptitle" data-i18n="panel_raid"></div><div id="raid-body"></div></div>
        <div class="ipanel" id="selbox"><div class="ptitle" data-i18n="panel_info"></div><div id="sel-body"></div></div>
      </div>
    </div>
  </section>

  <!-- ===== OVERLAYS ===== -->
  <div class="ovl" id="ovl-help"><div class="card">
    <h2 data-i18n="h_t"></h2><p id="help-body"></p>
    <button class="btn" data-close="ovl-help" data-i18n="btn_close"></button>
  </div></div>

  <div class="ovl" id="ovl-menu"><div class="card" style="width:340px">
    <h2>ALDEVARA</h2>
    <button class="btn prime" id="ovl-resume" data-i18n="btn_close"></button><br>
    <button class="btn" id="ovl-help2" data-i18n="btn_help"></button>
    <button class="btn" id="ovl-sound"></button><br>
    <button class="btn" id="ovl-lang"></button>
    <button class="btn" id="ovl-stages" data-i18n="btn_stages"></button><br>

/* ---------------- save / meta ---------------- */

  ctx: null, master: null, on: true, bgmTimer: null, step: 0, nextT: 0,

      case "up": [523, 659, 784].forEach((f, i) => this.tone(f, t + i * 0.07, 0.12, "triangle", 0.2)); break;
      case "coin": this.tone(1318, t, 0.07, "square", 0.12); this.tone(1760, t + 0.07, 0.1, "square", 0.12); break;
      case "err": this.tone(120, t, 0.18, "sawtooth", 0.14, 85); break;
      case "raid": this.tone(233, t, 0.5, "sawtooth", 0.2, 140); this.tone(233, t + 0.55, 0.6, "sawtooth", 0.2, 120); break;

document.addEventListener("pointerdown", () => { SND.init(); SND.resume(); }, { passive: true });

/* ---------------- state ---------------- */
let run = null;             // active game run
let screen = "screen-title";
let buildSel = null;        // building id selected for placement
let selIdx = -1;            // selected plot
let menuOpen = false;

let hudAcc = 0, saveAcc = 0, bannerTimer = null;

function newRun(si) {
  const S = STAGES[si];
  const r = {
    si, day: 0.25, res: { gold: S.gold, wood: S.wood, stone: S.stone, food: S.food },
    pop: S.pop, pen: 0, grid: new Array(NCELL).fill(null),
    nextRaid: S.raidEvery, raidSurvived: 0, bossesKilled: 0,
    raid: null, speed: 1, paused: false, over: false, logs: [], starveLogDay: -99

}

/* derived numbers */
const stg = () => STAGES[run.si];
const hallLvl = () => { const h = run.grid[HALL_IDX]; return h ? h.l : 1; };
/* district unlock: new land opens as the hall levels up (rings around the hall) */
function reqLvl(idx) {
  const hc = HALL_IDX % COLS, hr = (HALL_IDX / COLS) | 0;
  const dc = Math.abs((idx % COLS) - hc), dr = Math.abs(((idx / COLS) | 0) - hr);
  const d = Math.max(dc, dr);
  if (d <= 1) return 1;
  if (d === 2) return dc <= 1 ? 2 : 3;

}
const cellOpen = idx => reqLvl(idx) <= hallLvl();
const tilesForLvl = n => { let k = 0; for (let i = 0; i < NCELL; i++) if (reqLvl(i) === n) k++; return k; };
function housingCap() { let h = 12; run.grid.forEach(b => { if (b && BUILD[b.id].housing) h += BUILD[b.id].housing * b.l; }); return h; }
const capFood = () => 150 + 100 * hallLvl();
const capMat = () => 250 + 150 * hallLvl();
function happyVal() {
  let hp = 55;
  run.grid.forEach(b => { if (b && BUILD[b.id].happy) hp += BUILD[b.id].happy * b.l; });
  return clamp(hp - run.pen, 5, 100);
}
function workWant() {
  let w = 0; run.grid.forEach(b => { if (b && BUILD[b.id].wk) w += BUILD[b.id].wk * b.l; }); return w;
}
function workEff() { const w = workWant(); return w <= 0 ? 1 : Math.min(1, run.pop / w); }
function prodMult() { return stg().prod * (0.55 + 0.45 * happyVal() / 100) * workEff(); }
function curDef() {
  let d = 0;
  run.grid.forEach(b => { if (b && BUILD[b.id].def) d += BUILD[b.id].def * b.l; });

  return d * (1 + 0.06 * (hallLvl() - 1)) * (0.7 + 0.3 * happyVal() / 100);
}

  let f = 0;
  run.grid.forEach(b => {
    if (!b) return; const d = BUILD[b.id];
    if (d.food) f += d.food * b.l;
    if (d.eatFood) f -= d.eatFood * b.l;

}

  const bs = stg().boss || [];

}
function raidPow(boss) {

/* ---------------- log ---------------- */
function logMsg(key, p, cls) {

}

/* ---------------- build actions ---------------- */

function tryBuild(idx) {
  const id = buildSel, b = run.grid[idx];
  if (!id || b) return;
  if (!cellOpen(idx)) { logMsg("msg_area_locked", { v: reqLvl(idx) }, "bad"); SND.sfx("err"); return; }
  const D = BUILD[id];
  const lvlMax = Math.min(D.maxL, hallLvl());
  if (lvlMax < 1) { logMsg("msg_gate", { n: 1 }, "bad"); SND.sfx("err"); return; }
  if (D.needPop && run.pop < D.needPop) { logMsg("msg_popneed", {}, "bad"); SND.sfx("err"); return; }
  const c = costOf(id, 1);
  if (!canAfford(c)) { logMsg("msg_noafford", {}, "bad"); SND.sfx("err"); return; }
  pay(c);
  run.grid[idx] = { id, l: 1, inv: { gold: c.gold, wood: c.wood, stone: c.stone } };
  const t = tilePos(idx % COLS, (idx / COLS) | 0);
  spawnParts(t.sx, t.sy, "#d9a441", 10);
  logMsg("msg_built", { b: bName(id) }, "good");

}
function tryUpgrade() {
  const b = run.grid[selIdx]; if (!b) return;

  if (!canAfford(c)) { logMsg("msg_noafford", {}, "bad"); SND.sfx("err"); return; }
  pay(c);
  b.l = to; b.inv.gold += c.gold; b.inv.wood += c.wood; b.inv.stone += c.stone;
  logMsg("msg_up", { b: bName(b.id), n: to }, "good");

    const n = tilesForLvl(to);

      const ht = tilePos(HALL_IDX % COLS, (HALL_IDX / COLS) | 0);
      spawnParts(ht.sx, ht.sy, "#8fe08f", 20);

}
function tryDemolish() {
  const b = run.grid[selIdx]; if (!b || b.id === "hall") return;
  const g = { gold: Math.round(b.inv.gold * 0.5), wood: Math.round(b.inv.wood * 0.5), stone: Math.round(b.inv.stone * 0.5) };
  run.res.gold += g.gold; run.res.wood += g.wood; run.res.stone += g.stone;
  run.grid[selIdx] = null;
  logMsg("msg_dem", { b: bName(b.id) });
  SND.sfx("err");
  selIdx = -1; renderBuildList(); renderSel();
}

/* ---------------- raid ---------------- */
function spawnRaid() {
  const boss = raidIsBoss();
  const atk = raidPow(boss);
  run.raid = { t: 0, dur: Math.max(3.5, stg().raidEvery * 0.3), atk, boss };
  logMsg(boss ? "msg_boss" : "msg_raid", { a: fmt(atk) }, "bad");
  showBanner(tr(boss ? "msg_boss" : "msg_raid", { a: fmt(atk) }));
  SND.sfx("raid");
  try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) {}
}
function resolveRaid() {
  const d = curDef(), a = run.raid.atk, boss = run.raid.boss;
  SND.sfx("clash"); fx.flash = 0.5;
  spawnParts(gatePos().x, gatePos().y, "#ff7a50", 26);
  if (d >= a) {
    const loot = Math.round(12 + 0.45 * a);
    run.res.gold += loot;
    run.pop = Math.max(1, run.pop - run.pop * 0.02);
    run.pen += 4;
    logMsg("msg_wraid", { g: fmt(loot) }, "good");
    addFloat(gatePos().x, gatePos().y - 40, "+" + loot + " 💰", "#ffd76b");
    SND.sfx("coin");
    if (boss) run.bossesKilled++;
  } else {
    const gl = Math.round(run.res.gold * 0.3), fl = Math.round(run.res.food * 0.3);
    run.res.gold -= gl; run.res.food -= fl;
    const loss = run.pop * (0.10 + 0.20 * (1 - d / Math.max(1, a)));
    run.pop = Math.max(0, run.pop - loss);
    run.pen += 16;
    logMsg("msg_lraid", { g: fmt(gl), f: fmt(fl) }, "bad");
    addFloat(gatePos().x, gatePos().y - 40, "-" + fmt(gl) + " 💰", "#ff8f70");

/* ---------------- objectives / win / fail ---------------- */
function objProgress(c) {
  switch (c.t) {
    case "pop": return [Math.floor(run.pop), c.v];
    case "gold": return [Math.floor(run.res.gold), c.v];
    case "food": return [Math.floor(run.res.food), c.v];
    case "def": return [Math.round(curDef()), c.v];
    case "raid": return [run.raidSurvived, c.v];
    case "boss": return [run.bossesKilled, c.v];
    case "happy": return [Math.round(happyVal()), c.v];
    case "hall": return [hallLvl(), c.v];
    case "b": { let n = 0; run.grid.forEach(b => { if (b && b.id === c.id) n++; }); return [n, c.v]; }
  }
  return [0, 1];
}
function objText(c) {
  if (c.t === "b") return tr("o_b", { b: bName(c.id), v: c.v });
  return tr("o_" + c.t, { v: c.v });
}
function checkWin() {
  if (stg().conds.every(c => objProgress(c)[0] >= objProgress(c)[1])) winStage();
}
function winStage() {
  if (run.over) return;
  run.over = true;
  const S = stg(), d = Math.ceil(run.day);
  const stars = d <= S.par ? 3 : d <= Math.ceil(S.par * 1.5) ? 2 : 1;
  const key = run.si, rec = meta.rec[key] || { stars: 0, day: 1e9 };
  meta.rec[key] = { stars: Math.max(rec.stars, stars), day: Math.min(rec.day, d) };
  meta.unlocked = Math.max(meta.unlocked, Math.min(STAGES.length - 1, run.si + 1));
  meta.run = null; saveMeta();
  SND.sfx("win");
  $("#stars-big").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
  $("#win-info").textContent = tr("win_day", { d }) + " · " + tr("par_lbl", { d: S.par });
  const bw = $("#win-btns"); bw.innerHTML = "";
  if (run.si < STAGES.length - 1) {
    bw.appendChild(mkBtn(tr("btn_next"), "btn prime", () => { closeOverlays(); startStage(run.si + 1); }));
  } else {
    $("#win-info").textContent += "\n" + tr("allclear");
  }
  bw.appendChild(mkBtn(tr("btn_retry"), "btn", () => { closeOverlays(); startStage(run.si); }));
  bw.appendChild(mkBtn(tr("btn_menu"), "btn", () => { closeOverlays(); toTitle(); }));
  $("#ovl-win").classList.add("on");

/* ---------------- sim ---------------- */
function simUpdate(dt) {
  if (!run || run.over || run.paused || menuOpen) return;
  const S = stg();
  const dday = dt / DAYLEN * run.speed;
  run.day += dday;

  const pm = prodMult();
  let fw = 0, ww = 0, sw = 0, gw = 0;
  run.grid.forEach(b => {
    if (!b) return; const d = BUILD[b.id];
    if (d.food) fw += d.food * b.l;
    if (d.wood) ww += d.wood * b.l;
    if (d.stone) sw += d.stone * b.l;
    if (d.gold) gw += d.gold * b.l;
    if (d.useWood) ww -= d.useWood * b.l;
    if (d.eatFood) fw -= d.eatFood * b.l;
  });
  run.res.food = clamp(run.res.food + (fw * pm - 0.35 * run.pop) * dday, 0, capFood());
  run.res.wood = clamp(run.res.wood + ww * pm * dday, 0, capMat());
  run.res.stone = clamp(run.res.stone + sw * pm * dday, 0, capMat());
  run.res.gold += (gw * pm + run.pop * 0.15 * pm) * dday;

  const cap = housingCap(), happy = happyVal();
  if (run.pop < cap && run.res.food > 5 && happy > 45)
    run.pop = Math.min(cap, run.pop + (0.4 + run.pop * 0.022) * dday * Math.max(0.4, happy / 70));
  if (run.res.food <= 0 && fw * pm < 0.35 * run.pop) {
    run.pop -= 0.5 * dday;
    if (run.day - run.starveLogDay > 25) { run.starveLogDay = run.day; logMsg("msg_starve", {}, "bad"); }
  }
  if (run.pop > cap) run.pop = Math.max(cap, run.pop - 0.5 * dday);
  run.pen = Math.max(0, run.pen - 2 * dday);

  if (run.raid) {
    run.raid.t += dday;
    if (run.raid.t >= run.raid.dur) resolveRaid();
  } else {
    run.nextRaid -= dday;
    if (run.nextRaid <= 0) spawnRaid();
  }

  if (run.pop < 1) { run.pop = 0; failGame(); return; }
  checkWin();

  saveAcc += dt;
  if (saveAcc > 4) { saveAcc = 0; autosave(false); }
}
function autosave(flashChip) {
  if (!run || run.over) return;
  meta.run = JSON.parse(JSON.stringify(run));
  saveMeta();
  $("#btn-continue").style.display = "";
  if (flashChip) {
    const c = $("#savechip");
    c.style.opacity = 1;
    setTimeout(() => { c.style.opacity = 0; }, 1100);
  }
}

/* ---------------- canvas ---------------- */
const cv = $("#cv"), ctx = cv.getContext("2d");
let LW = 580, LH = 494, RS = 1, TW = 76, TH = 38, OX = 0, OY = 0, appScale = 1;
function fit() {
  const iw = window.innerWidth, ih = window.innerHeight;
  const app = $("#app");
  if (ih > iw) {
    // portrait: rotate the whole app 90deg so phones in either orientation just work
    appScale = Math.min(iw / 540, ih / 960);
    app.style.transform = "translate(-50%,-50%) rotate(90deg) scale(" + appScale + ")";
  } else {
    appScale = Math.min(iw / 960, ih / 540);
    app.style.transform = "translate(-50%,-50%) scale(" + appScale + ")";
  }
  const w = cv.clientWidth, hgt = cv.clientHeight;
  if (!w || !hgt) return;
  LW = w; LH = hgt;
  RS = appScale * (window.devicePixelRatio || 1);
  cv.width = Math.round(w * RS); cv.height = Math.round(hgt * RS);
  OX = LW / 2 - ((COLS - 1) - (ROWS - 1)) * TW / 4;
  OY = LH / 2 - 118;
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 120));
function tilePos(x, y) { return { sx: OX + (x - y) * TW / 2, sy: OY + (x + y) * TH / 2 }; }
function gatePos() { const t = tilePos(COLS - 1, ROWS - 1); return { x: t.sx, y: t.sy + TH * 0.9 }; }
function pickTile(px, py) {
  const a = (px - OX) / (TW / 2), b = (py - OY) / (TH / 2);
  const x = Math.round((a + b) / 2), y = Math.round((b - a) / 2);
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return -1;
  return y * COLS + x;
}

/* --- drawing --- */
let tNow = 0;
function draw(dtReal) {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.clearRect(0, 0, LW, LH);
  const ph = run.day % 1;
  const light = 0.5 + 0.5 * Math.sin(ph * Math.PI * 2 - Math.PI / 2);

  /* sky */
  const sky = ctx.createLinearGradient(0, 0, 0, LH);
  const top = mixc("#2f4a7a", "#8fc0e8", light), bot = mixc("#243250", "#d9e8f2", light);
  sky.addColorStop(0, top); sky.addColorStop(1, bot);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, LW, LH);
  if (light < 0.4) { // stars
    ctx.fillStyle = "rgba(255,255,255," + (0.4 - light) * 1.8 + ")";
    for (let i = 0; i < 26; i++) {
      const sx = (i * 197 + 41) % LW, sy = (i * 89 + 13) % (LH * 0.4);
      ctx.fillRect(sx, sy, 1.6, 1.6);
    }
  }
  /* sun / moon */
  const cel = light > 0.45;
  const cf = cel ? (ph - 0.15) / 0.4 : ((ph < 0.15 ? ph + 1 : ph) - 0.6) / 0.55;
  if (cf > -0.05 && cf < 1.05) {
    const cx = LW * cf, cy = 70 - Math.sin(clamp(cf, 0, 1) * Math.PI) * 46;
    ctx.beginPath(); ctx.arc(cx, cy, cel ? 14 : 10, 0, 7);
    ctx.fillStyle = cel ? "rgba(255,224,130,.95)" : "rgba(226,232,244,.9)";
    ctx.fill();
  }
  /* mountains */
  drawRidge(OY - 96, 26, "#3c4a63", 7);
  drawRidge(OY - 66, 20, "#33405a", 11);
  /* ground */
  const g2 = ctx.createLinearGradient(0, OY - 50, 0, LH);
  g2.addColorStop(0, mixc("#3e4a3a", "#7ba35c", light));
  g2.addColorStop(1, mixc("#2c3327", "#54753f", light));
  ctx.fillStyle = g2; ctx.fillRect(0, OY - 50, LW, LH - OY + 50);
  /* trees */
  drawTree(28, OY - 30, light); drawTree(LW - 34, OY - 12, light); drawTree(LW - 66, OY - 40, light);

  /* road to gate */
  const G = gatePos();
  ctx.strokeStyle = "#8a6c48"; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(LW + 10, LH - 12); ctx.quadraticCurveTo(LW * 0.75, LH - 8, G.x + 6, G.y); ctx.stroke();
  ctx.strokeStyle = "#6e5638"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(LW + 10, LH - 14); ctx.quadraticCurveTo(LW * 0.75, LH - 10, G.x + 6, G.y); ctx.stroke();
  drawGate(G.x, G.y);

  /* tiles */
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = tilePos(x, y), idx = y * COLS + x;
    const lock = !cellOpen(idx);
    ctx.fillStyle = diamondFill(x, y, idx);
    diamond(x, y); ctx.fill();
    if (lock) {
      ctx.fillStyle = "rgba(22,24,32,.52)"; diamond(x, y); ctx.fill();
      ctx.font = "10px 'Segoe UI Emoji'"; ctx.textAlign = "center";
      ctx.globalAlpha = 0.8; ctx.fillText("🔒", t.sx, t.sy + 4); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "rgba(20,26,18,.5)"; ctx.lineWidth = 1; ctx.stroke();
    if (buildSel && !run.grid[idx] && !lock) {
      const pulse = 0.25 + 0.2 * Math.sin(tNow * 4);
      ctx.strokeStyle = "rgba(217,164,65," + pulse + ")"; ctx.lineWidth = 2;
      diamond(x, y, 3); ctx.stroke();
    }
  }
  /* selected tile marker */
  if (selIdx >= 0) {
    const sx = selIdx % COLS, sy = (selIdx / COLS) | 0;
    ctx.strokeStyle = "#e7c66b"; ctx.lineWidth = 2.5;
    diamond(sx, sy, 2); ctx.stroke();
    const t = tilePos(sx, sy);
    ctx.fillStyle = "#e7c66b";
    const bob = Math.sin(tNow * 5) * 3;
    ctx.beginPath();
    ctx.moveTo(t.sx - 6, t.sy - 46 + bob); ctx.lineTo(t.sx + 6, t.sy - 46 + bob); ctx.lineTo(t.sx, t.sy - 38 + bob);
    ctx.closePath(); ctx.fill();
  }

  /* buildings sorted */
  const order = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (run.grid[y * COLS + x]) order.push([x, y]);
  }
  order.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
  order.forEach(([x, y]) => {
    const b = run.grid[y * COLS + x], t = tilePos(x, y);
    drawBuilding(b, t.sx, t.sy, light);
  });

  /* raid bandits */
  if (run.raid) drawBandits();

  /* particles / floats */
  fx.parts = fx.parts.filter(p => (p.t -= dtReal) > 0);
  fx.parts.forEach(p => {
    p.x += p.vx * dtReal; p.y += p.vy * dtReal; p.vy += 60 * dtReal;
    ctx.globalAlpha = clamp(p.t / 0.6, 0, 1);
    ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  });
  ctx.globalAlpha = 1;
  fx.floats = fx.floats.filter(f => (f.t -= dtReal) > 0);
  fx.floats.forEach(f => {
    f.y -= 26 * dtReal;
    ctx.globalAlpha = clamp(f.t, 0, 1);
    ctx.font = "bold 14px 'Segoe UI'";
    ctx.fillStyle = f.c; ctx.textAlign = "center";
    ctx.fillText(f.s, f.x, f.y);
    ctx.globalAlpha = 1;
  });

  /* night tint */
  const na = (1 - light) * 0.5;
  if (na > 0.02) { ctx.fillStyle = "rgba(14,20,50," + na + ")"; ctx.fillRect(0, 0, LW, LH); }
  if (fx.flash > 0) {
    fx.flash -= dtReal * 2;
    ctx.fillStyle = "rgba(255,120,60," + Math.max(0, fx.flash) * 0.5 + ")";
    ctx.fillRect(0, 0, LW, LH);
  }
}
function diamondFill(x, y, idx) {
  const occ = run.grid[idx];
  const shade = ((x * 7 + y * 13) % 3);
  const ph = run.day % 1, light = 0.5 + 0.5 * Math.sin(ph * Math.PI * 2 - Math.PI / 2);
  const dayC = occ ? ["#8f9a6b", "#88935f", "#93a071"][shade] : ["#96b06b", "#8ea963", "#9cb772"][shade];
  const nightC = occ ? ["#43495f", "#404658", "#454c62"][shade] : ["#41506b", "#3d4c66", "#44536e"][shade];
  return mixc(nightC, dayC, light);
}
function diamond(x, y, grow) {
  const t = tilePos(x, y), g = grow || 0;
  ctx.beginPath();
  ctx.moveTo(t.sx, t.sy - TH / 2 - 1 - g);
  ctx.lineTo(t.sx + TW / 2 + g, t.sy);
  ctx.lineTo(t.sx, t.sy + TH / 2 + 1 + g);
  ctx.lineTo(t.sx - TW / 2 - g, t.sy);
  ctx.closePath();
}
function mixc(c1, c2, t) {
  const p = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const a = p(c1), b = p(c2);
  return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(t, 0, 1)))).join(",") + ")";

function drawRidge(baseY, amp, col, seed) {

function drawBanditSprite(x, y, s, boss) {

/* ---------------- input ---------------- */
cv.addEventListener("pointerdown", e => {
  if (!run || screen !== "screen-game") return;
  const rect = cv.getBoundingClientRect();
  let px, py;
  if (window.innerHeight > window.innerWidth) {
    // portrait: #app is rotated 90deg — undo the rotation for pointer coords
    const s = rect.width / LH;
    px = LW / 2 + (e.clientY - rect.top - rect.height / 2) / s;
    py = LH / 2 - (e.clientX - rect.left - rect.width / 2) / s;
  } else {
    px = (e.clientX - rect.left) * (LW / rect.width);
    py = (e.clientY - rect.top) * (LH / rect.height);
  }
  const idx = pickTile(px, py);
  if (idx < 0) { selIdx = -1; renderSel(); return; }
  if (buildSel && !run.grid[idx]) { tryBuild(idx); renderRaidBox(); return; }
  selIdx = run.grid[idx] ? idx : -1;
  SND.sfx("click");
  renderSel();
});

  meta.lang = lang; saveMeta(); applyLang();
}
function soundToggle() { SND.setOn(!SND.on); refreshLangSound(); }
wire("#btn-sound", soundToggle);
wire("#btn-sound2", soundToggle);
wire("#ovl-sound", soundToggle);

/* speed / pause / menu */
wire("#btn-pause", () => { if (run) { run.paused = !run.paused; refreshPause(); } });
$$(".spd").forEach(b => b.addEventListener("click", () => {
  SND.sfx("click");
  if (run) { run.speed = +b.dataset.s; run.paused = false; refreshPause(); }
}));
function refreshPause() {
  $("#btn-pause").textContent = run && run.paused ? "▶" : "❚❚";
  $$(".spd").forEach(b => b.classList.toggle("on2", run && !run.paused && +b.dataset.s === run.speed));
}
wire("#btn-menu", () => { menuOpen = true; refreshLangSound(); $("#ovl-menu").classList.add("on"); });
wire("#ovl-resume", () => { closeOverlays(); });
wire("#ovl-help2", () => { $("#help-body").textContent = tr("h_body"); $("#ovl-help").classList.add("on"); });
wire("#ovl-stages", () => { closeOverlays(); autosave(true); renderStages(); });
wire("#ovl-exit", () => { autosave(true); meta.run = run && !run.over ? JSON.parse(JSON.stringify(run)) : meta.run; saveMeta(); toTitle(); refreshTitle(); });

/* ---------------- stages screen ---------------- */
function renderStages() {
  show("screen-stages");
  const g = $("#stages-grid"); g.innerHTML = "";
  let total = 0;
  STAGES.forEach((S, i) => {
    const locked = i > meta.unlocked;
    const rec = meta.rec[i];
    if (rec) total += rec.stars;
    const c = document.createElement("div");
    c.className = "scard" + (locked ? " locked" : "");
    c.innerHTML = '<div class="no">' + tr("stage_lbl", { n: i + 1 }) + "</div>" +
      '<div class="nm">' + tr("s" + i + "_n") + "</div>" +
      '<div class="ds">' + (locked ? tr("locked") : tr("s" + i + "_h")) + "</div>" +
      '<div class="st">' + (rec ? "★".repeat(rec.stars) + "☆".repeat(3 - rec.stars) : "☆☆☆") + "</div>" +
      '<div class="bd">' + (rec ? tr("best_day", { d: rec.day }) : tr("no_record")) + "</div>";
    if (!locked) c.addEventListener("click", () => { SND.sfx("click"); startStage(i); });
    g.appendChild(c);
  });
  $("#star-total").textContent = total;
}

/* ---------------- title / lang apply ---------------- */
function refreshTitle() {
  $("#btn-continue").style.display = meta.run ? "" : "none";
}
function refreshLangSound() {
  const ln = lang === "ja" ? "JA" : lang === "en" ? "EN" : "中文";
  $("#btn-lang").textContent = tr("lang_label") + ": " + ln;
  $("#btn-lang2").textContent = ln;
  $("#ovl-lang").textContent = tr("lang_label") + ": " + ln;
  const so = tr(SND.on ? "sound_on" : "sound_off");
  $("#btn-sound").textContent = so;
  $("#btn-sound2").textContent = SND.on ? "🔊" : "🔇";
  $("#ovl-sound").textContent = so;
}
function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
  refreshTitle(); refreshLangSound();
  $("#help-body").textContent = tr("h_body");
  if (screen === "screen-game" && run) { renderBuildList(); renderObj(); renderSel(); renderRaidBox(); renderLog(); updateHUD(); }
  if (screen === "screen-stages") renderStages();
  refreshPause();
}

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  tNow += dt;
  if (screen === "screen-game" && run) {
    simUpdate(dt);
    draw(dt);
    hudAcc += dt;
    if (hudAcc > 0.12) { hudAcc = 0; updateHUD(); }
  }
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
loadMeta();
applyLang();
fit();
refreshTitle();
requestAnimationFrame(loop);
if (meta.run) $("#btn-continue").style.display = "";

</script>
</body>
</html>
